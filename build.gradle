plugins {
	id 'fabric-loom' version '1.18.2'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	runs {
		client {
			// 起動時に全 Mixin を適用して失敗を洗い出す (SavestateMod 参照)
			vmArg "-Dmcsr-savestate.audit=true"
			// 調査用ログ (SavestateDebug)
			vmArg "-Dmcsr-savestate.debug=true"
			// 決定論の自動検査: ./gradlew runClient -PdetcheckWorld=<フォルダ名> [-PdetcheckTicks=100] [-PdetcheckRuns=3]
			if (project.hasProperty("detcheckWorld")) {
				vmArg "-Dmcsr-savestate.detcheck.world=${project.property('detcheckWorld')}"
				vmArg "-Dmcsr-savestate.detcheck.exit=true"
			}
			// 方式の切り替え: -PsavestateMode=disk (既定は memory)
			if (project.hasProperty("savestateMode")) {
				vmArg "-Dmcsr-savestate.mode=${project.property('savestateMode')}"
			}
			// かき乱し: -PdetcheckDisturb=far|dim|end
			if (project.hasProperty("detcheckDisturb")) {
				vmArg "-Dmcsr-savestate.detcheck.disturb=${project.property('detcheckDisturb') ?: 'far'}"
			}
			// 取得する場所: -PdetcheckStart=overworld|nether|end
			if (project.hasProperty("detcheckStart")) {
				vmArg "-Dmcsr-savestate.detcheck.start=${project.property('detcheckStart')}"
			}
			if (project.hasProperty("detcheckDump")) {
				vmArg "-Dmcsr-savestate.detcheck.dump=${project.property('detcheckDump')}"
			}
			if (project.hasProperty("detcheckTicks")) {
				vmArg "-Dmcsr-savestate.detcheck.ticks=${project.property('detcheckTicks')}"
			}
			if (project.hasProperty("detcheckRuns")) {
				vmArg "-Dmcsr-savestate.detcheck.runs=${project.property('detcheckRuns')}"
			}
		}
	}
}

// Fabric API is intentionally not used (MCSR convention). Only Minecraft + Fabric Loader.
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
