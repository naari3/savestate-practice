plugins {
	id 'fabric-loom' version '1.18.2'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	runs {
		client {
			// 起動時に全 Mixin を適用して失敗を洗い出す (SavestateMod 参照)
			vmArg "-Dsavestate-practice.audit=true"
			// 調査用ログ (SavestateDebug)
			vmArg "-Dsavestate-practice.debug=true"
			// 決定論の自動検査: ./gradlew runClient -PdetcheckWorld=<フォルダ名> [-PdetcheckTicks=100] [-PdetcheckRuns=3]
			if (project.hasProperty("detcheckWorld")) {
				vmArg "-Dsavestate-practice.detcheck.world=${project.property('detcheckWorld')}"
				vmArg "-Dsavestate-practice.detcheck.exit=true"
			}
			// 方式の切り替え: -PsavestateMode=disk (既定は memory)
			if (project.hasProperty("savestateMode")) {
				vmArg "-Dsavestate-practice.mode=${project.property('savestateMode')}"
			}
			// かき乱し: -PdetcheckDisturb=far|dim|end|block
			if (project.hasProperty("detcheckDisturb")) {
				vmArg "-Dsavestate-practice.detcheck.disturb=${project.property('detcheckDisturb') ?: 'far'}"
			}
			// 取得する場所: -PdetcheckStart=overworld|nether|end
			if (project.hasProperty("detcheckStart")) {
				vmArg "-Dsavestate-practice.detcheck.start=${project.property('detcheckStart')}"
			}
			// 故障の注入: -PfailApply=N (N 回目の復元の適用段階で例外を投げる)
			if (project.hasProperty("failApply")) {
				vmArg "-Dsavestate-practice.debug.failApply=${project.property('failApply')}"
			}
			if (project.hasProperty("detcheckDump")) {
				vmArg "-Dsavestate-practice.detcheck.dump=${project.property('detcheckDump')}"
			}
			if (project.hasProperty("detcheckDumpTicks")) {
				vmArg "-Dsavestate-practice.detcheck.dumpTicks=${project.property('detcheckDumpTicks')}"
			}
			if (project.hasProperty("detcheckTicks")) {
				vmArg "-Dsavestate-practice.detcheck.ticks=${project.property('detcheckTicks')}"
			}
			if (project.hasProperty("detcheckRuns")) {
				vmArg "-Dsavestate-practice.detcheck.runs=${project.property('detcheckRuns')}"
			}
		}
	}
}

// Fabric API は使わない。設定・キー登録・lang の読み込みは SpeedrunAPI を使う
repositories {
	maven { url = "https://jitpack.io" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// 任意の依存: 設定画面、キー登録 (key-binding-api を同梱)、MOD の lang の読み込み。なくても動く (Settings、mixin.fallback)
	// 最新版は https://jitpack.io/#contariaa/speedrunapi で確認する
	// -PnoSpeedrunApi を付けると、コンパイルにだけ使い、runClient には入れない (ないときの動作の確認用)
	if (project.hasProperty("noSpeedrunApi")) {
		modCompileOnly "com.github.contariaa:SpeedrunAPI:${project.speedrunapi_version}"
	} else {
		modImplementation "com.github.contariaa:SpeedrunAPI:${project.speedrunapi_version}"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// 開発用の起動は、古い Fabric Loader (0.16.x) が読める Java 17 で行う (利用者の環境に合わせる)。
// Loader 0.16.x の ASM は JDK 25 のクラスファイルを読めない
tasks.named("runClient") {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
}
