name: Publish Release

# GitHub で Release を publish すると走る。tag は v<mod_version> (例 v0.1.0) にすること。
# 今は GitHub Release に jar を添付するだけ。Modrinth / CurseForge に出すときは、プロジェクトを作って
# fabric.mod.json の custom.mc-publish に ID を書き、secrets (MODRINTH_TOKEN, CF_API_TOKEN) と下の token を足す。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle and loom
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            .gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Read mod version and check it against the tag
        id: props
        run: |
          v=$(sed -n 's/^mod_version=\(.*\)$/\1/p' gradle.properties)
          echo "mod_version=$v" >> "$GITHUB_OUTPUT"
          echo "mod_version: $v, tag: ${{ github.event.release.tag_name }}"
          if [ "${{ github.event.release.tag_name }}" != "v$v" ]; then
            echo "::error::tag ${{ github.event.release.tag_name }} does not match mod_version $v (expected v$v)"
            exit 1
          fi

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Find the built jar (exclude sources)
        id: jar
        run: |
          f=$(find build/libs -name 'savestate-practice-*.jar' ! -name '*-sources.jar' | head -n1)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "jar: $f"

      - name: Publish to GitHub
        uses: Kira-NT/mc-publish@v3
        with:
          name: Savestate Practice ${{ github.event.release.tag_name }}
          version: ${{ steps.props.outputs.mod_version }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}

          game-versions: 1.16.1
          loaders: fabric
          java: 8

          files: ${{ steps.jar.outputs.file }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
